name: Android

# push / pull request: build check only (debug APK as workflow artifact, no release)
# release:  Actions → Android → "Run workflow" with release = true, or push a tag v1.2.3
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['android/**', 'web/public/demo/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit signierter APK erstellen'
        type: boolean
        default: false
      version:
        description: 'Versionsname, z. B. 0.2.0 (leer = 0.2.<Build-Nummer>)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches missing platforms itself
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}";
          elif [[ -n "${{ inputs.version }}" ]]; then NAME="${{ inputs.version }}";
          else NAME="0.2.${{ github.run_number }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "GAPMIN_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          # stays above the version codes of the former Capacitor builds
          echo "GAPMIN_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Unit tests (import chain with the demo export)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests 'de.moritzbelli.gapmin.core.*' 2>&1 | tee build.log

      - name: Build debug APK (check)
        if: env.IS_RELEASE != 'true'
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -10 | while IFS= read -r l; do echo "::error title=Kotlin::${l:0:900}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o '<failure message="[^"]*' "$f" | head -3 | while IFS= read -r l; do echo "::error title=Test::${l:0:900}"; done
          done
          ctx=$(grep -A12 'What went wrong' build.log | head -14 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          [ -n "$ctx" ] && echo "::error title=Gradle::${ctx:0:3000}"
          exit 0

      # Screenshots of the main screens (Robolectric), pushed to the branch ci-screenshots for review
      - name: Screenshots
        if: env.IS_RELEASE != 'true' && github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests 'de.moritzbelli.gapmin.ui.ScreenshotTest' 2>&1 | tee shots.log || {
            grep -E '^e: |Exception|Error' shots.log | head -8 | while IFS= read -r l; do echo "::warning title=Screenshots::${l:0:900}"; done
            for f in app/build/test-results/testDebugUnitTest/*Screenshot*.xml; do
              [ -f "$f" ] && grep -o '<failure message="[^"]*' "$f" | head -2 | while IFS= read -r l; do echo "::warning title=Screenshot-Test::${l:0:900}"; done
            done
          }
          cd app/build/screenshots
          git init -q . && git checkout -q -b ci-screenshots
          git add *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: gapmin-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt. Siehe docs/ANDROID.md (scripts/create-android-keystore.sh)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gapmin.jks"
          echo "GAPMIN_KEYSTORE=$RUNNER_TEMP/gapmin.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          GAPMIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GAPMIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GAPMIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gapmin-${GAPMIN_VERSION_NAME}.apk"

      - name: GitHub release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Gapmin ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: ${{ runner.temp }}/gapmin-${{ steps.ver.outputs.name }}.apk
